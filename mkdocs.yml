site_name: SMEdit3
site_description: A GUI editor for StarMade blueprints (ships, stations, planets)
repo_url: https://github.com/StarMade-Community/SMEdit3
repo_name: StarMade-Community/SMEdit3
docs_dir: docs

theme:
  name: material
  palette:
    scheme: slate
    primary: blue grey
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Opening a blueprint: tutorials/opening-a-blueprint.md
  - Reference:
      - Architecture: ARCHITECTURE.md
      - StarMade compatibility: STARMADE_COMPATIBILITY.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true
