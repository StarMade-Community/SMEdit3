plugins {
    id 'java'
    id 'application'
}

group = 'smc.smedit'
version = '3.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// LWJGL 2.9.3 — the same version StarMade ships (previously SMEdit vendored the
// older 2.9.1). Only the pure-Java jars are pulled from Maven; the *native*
// libraries are loaded at runtime from the StarMade install's native/<os>
// folder (see smc.smedit.logic.StarMadeLogic#setBaseDir). StarMade rebuilds its
// LWJGL natives for Java 9+, whereas the stock LWJGL 2.x natives on Maven still
// link the removed libjawt `SUNWprivate_1.1` symbol and fail to load on the
// Java 21 toolchain -- so we deliberately do NOT depend on lwjgl-platform here.
def lwjglVersion = '2.9.3'

dependencies {
    implementation "org.lwjgl.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl.lwjgl:lwjgl_util:${lwjglVersion}"
}

application {
    mainClass = 'smc.smedit.SMEdit'
}

jar {
    archiveBaseName = 'SMEdit'
    manifest {
        attributes 'Main-Class': 'smc.smedit.SMEdit'
    }
}
